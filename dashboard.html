<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard, Budget ledger</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=2">
</head>
<body>
<main class="wrap" id="appView" hidden>

  <div class="filters">
    <div class="tabs" role="tablist" aria-label="Whose budget" id="whoTabs" hidden></div>
    <div class="filterset">
      <div class="seg" role="radiogroup" aria-label="How far back">
        <label><input type="radio" name="range" value="6" checked><span>6 months</span></label>
        <label><input type="radio" name="range" value="12"><span>12 months</span></label>
      </div>
      <div class="monthnav">
        <button class="iconbtn" id="dPrev" type="button" aria-label="Previous month">&lsaquo;</button>
        <div id="dMonth" class="monthlabel" aria-live="polite"></div>
        <button class="iconbtn" id="dNext" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
    </div>
  </div>

  <div id="dash" class="dash" role="tabpanel" tabindex="-1"></div>

</main>

<div id="tip" class="tip" role="presentation" hidden></div>

<script src="assets/supabase.js?v=2.117.2"></script>
<script src="assets/shell.js?v=2"></script>
<script src="assets/dashboard.js?v=2"></script>
</body>
</html>
